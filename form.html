<!doctype html>
<html>
    <head>
        <title>Forms In HTML</title>
    </head>
    <body>
<h1>Create Your User Account</h1>
<form action="thanks.html">
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Full Name" required><br>
<label for="email">Email ID</label>
<input type="email" id="email" name="Email" placeholder="Active Email ID"><br>
<label for="userName">UserName</label>
<input type="text" id="userName" name="UserName" Placeholder="Use A-Z and 0-9" minlength="6" maxlength="30"
pattern="[a-zA-Z0-9]"><br>
<label for="password">Account Password</label>
<input type="password" id="password" name="Password" placeholder="Password" required><br>
<label for="mobile">Phone Number</label>
<input type="number" id="mobile" name="Mobile" placeholder="Phone" ></br>
<fieldset>
<legend>Select Your Gender</legend>
<label for="male">I am a male</label>
<input type="radio" id="male" name="Gender" placeholder="I am male" ><br>
<label for="female">I am a female</label>
<input type="radio" id="female" name="Gender" placeholder="I am female" ><br>
</fieldset>
<label for="dob">Date Of Birth</label>
<input type="date" id="dob" name="DOB" ></br>
<label for="address">Mailing Address</label>
<textarea id="address" name="Address" placeholder="Address" rows="4" cols="30"></textarea>
<label for="lang">Prefered Language</label>
<select id="lang" name="Language" >
<option disabled selected>Please Select Your Language</option>
<option value="English">English</option>
<option value="Bengali">Bengali</option>
<option value="Hindi">Hindi</option>
</select>
<label for="Course">Select your course to enroll</label>
<input list="course" id="Course" name="course" >
<datalist id="course">
<option value="java">java</option>
<option value="php">php</option>
<option value="python">python</option>
<option value="javascript">javascript</option>
<option value="kotlin">kotlin</option>
<option value="CSS">CSS</option>
<option value="C">C Language</option>
</datalist>
<label for="image">Upload Profile Picture</label>
<input type="file" id="image" name="Profile_Pic"><br>
<label for="url">Facebook Link</label>
<input type="url" id="url" name="Facebook"><br>
<label for="book">Select your schedule</label>
<input type="datetime-local" id="book" name="Appoitnment" min="2024-03-14"><br>
<label for="range">Rate Your Experience About this Form</label>
<input type="range" id="range" name="Ratings" min="1" max="10" ><br>
<label for="color">Select your color</label>
<input type="color" id="color" name="color">
<label>Terms and Conditions</label>
<label for="checkbox">I agree</label>
<input type="checkbox" id="checkbox" name="terms" placeholder="I agree" ><br>

<input type="reset" value="Reset"><br>
<input type="submit" value="Register"><br>

    </body>
</html>
