<!doctype html>
<html>
    <head>
        <title>Using Rowspan</title>
    </head>
    <body>
<h1>Table With Rowspan</h1>
<table>
  <tr>
    <th>Item</th>
    <th>Variant</th>
    <th>Price</th>
  </tr>

    <td>8/128</td>
    <td>32000</td>
  </tr>
  <tr>
    <td rowspan="2">Samsung Y123</td>
    <td>6/128</td>
    <td>32100</td>
  </tr>
  <tr>
    <td>8/128</td>
    <td>35400</td>
  </tr>
  <tr>
    <td rowspan="2">Vivo Z123</td>
    <td>6/128</td>
    <td>13500</td>
  </tr>
  <tr>
    <td>8/128</td>
    <td>15400</td>
  </tr>
  <tr>
    <td rowspan="2">Redmi N123</td>
    <td>6/128</td>
    <td>16500</td>
  </tr>
  <tr>
    <td>8/128</td>
    <td>17500</td>
  </tr>
  <tr>
    <td rowspan="2">Realme J123</td>
    <td>6/128</td>
    <td>11500</td>
  </tr>
  <tr>
    <td>8/128</td>
    <td>13200</td>
  </tr>
</table>

    </body>
</html>
